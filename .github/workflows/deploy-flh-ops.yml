name: Deploy FLH publication clock and watchdog
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flh-ops-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FLH_DISPATCH_TOKEN: ${{ secrets.FLH_DISPATCH_TOKEN }}
      HC_CLOCK_URL: ${{ secrets.HC_CLOCK_URL }}
      HC_WATCHDOG_URL: ${{ secrets.HC_WATCHDOG_URL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      STATUS_TOKEN: ${{ secrets.STATUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check required credentials before any deployment
        run: |
          node -e 'const ns=["CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID","FLH_DISPATCH_TOKEN","HC_CLOCK_URL","HC_WATCHDOG_URL","NTFY_TOPIC","STATUS_TOKEN"];const missing=ns.filter(n=>!process.env[n]);if(missing.length){console.error("Missing repository secrets: "+missing.join(", "));process.exit(1)}'
      - name: Test operational logic
        run: node --test ops/cloudflare/test/ops.test.mjs
      - name: Install official Cloudflare deploy tool
        run: npm install --no-save --package-lock=false wrangler@4
      - name: Deploy and configure monitored schedulers
        run: node ops/cloudflare/deploy/deploy.mjs
