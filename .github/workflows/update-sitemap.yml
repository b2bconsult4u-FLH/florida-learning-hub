name: Update sitemap
on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "scripts/generate-sitemap.mjs"
      - ".github/workflows/update-sitemap.yml"
permissions:
  contents: write
concurrency:
  group: sitemap-main
  cancel-in-progress: false
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Generate and commit sitemap when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            # This disposable checkout contains only this job's generated changes.
            # Rebuild from current main rather than pushing an outdated sitemap.
            git fetch origin main
            git reset --hard origin/main
            node scripts/generate-sitemap.mjs
            if git diff --quiet -- sitemap.xml; then exit 0; fi
            git add sitemap.xml
            git commit -m "Update sitemap"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push failed; refreshing main and regenerating (attempt $attempt/5)."
          done
          echo "::error::Unable to publish sitemap after 5 attempts."
          exit 1

      - name: Notify IndexNow about changed HTML
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          changed_urls=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- '*.html' | sed 's#^#https://floridalearninghub.org/#')
          if [ -z "$changed_urls" ]; then
            echo "No changed HTML URLs to submit."
            exit 0
          fi
          printf '%s\n' "$changed_urls" | python -c 'import json,sys; urls=[line.strip() for line in sys.stdin if line.strip()]; print(json.dumps({"host":"floridalearninghub.org","key":"a91f7c6e5d4b3a2f8e7d6c5b4a392817","keyLocation":"https://floridalearninghub.org/a91f7c6e5d4b3a2f8e7d6c5b4a392817.txt","urlList":urls}))' > /tmp/indexnow.json
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow.json \
            https://api.indexnow.org/indexnow
