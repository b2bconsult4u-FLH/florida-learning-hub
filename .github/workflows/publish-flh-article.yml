name: Publish FLH Mini Article

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      asset_id:
        description: "Optional FLH Asset ID for a controlled manual run"
        required: false
        type: string
      confirm_publish:
        description: "Type PUBLISH for a controlled manual run"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: flh-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'schedule' || inputs.confirm_publish == 'PUBLISH' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publisher dependencies
        run: pip install --disable-pip-version-check google-api-python-client google-auth python-docx requests

      - name: Find eligible approved Mini articles
        id: queue
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.FLH_GOOGLE_SERVICE_ACCOUNT_JSON }}
          FLH_PUBLISHING_SHEET_ID: 1ZkXrlRelnaCV9OdQcv2IqX_jSJ-ke2C47u2myZGeHnQ
          MANUAL_ASSET_ID: ${{ inputs.asset_id }}
        run: |
          if [ -n "$MANUAL_ASSET_ID" ]; then
            printf '%s\n' "$MANUAL_ASSET_ID" > /tmp/flh_queue.txt
          else
            python scripts/list_ready_flh_minis.py > /tmp/flh_queue.txt
          fi
          echo "Eligible queue:"
          cat /tmp/flh_queue.txt || true

      - name: Publish eligible Mini articles
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.FLH_GOOGLE_SERVICE_ACCOUNT_JSON }}
          FLH_PUBLISHING_SHEET_ID: 1ZkXrlRelnaCV9OdQcv2IqX_jSJ-ke2C47u2myZGeHnQ
        run: |
          if [ ! -s /tmp/flh_queue.txt ]; then
            echo "No eligible Mini articles. Nothing to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while IFS= read -r asset_id; do
            [ -z "$asset_id" ] && continue
            echo "=== Publishing $asset_id ==="
            export FLH_ASSET_ID="$asset_id"
            export FLH_ARTICLE_TYPE="Mini"

            python scripts/publish_flh_article.py
            python scripts/update_flh_library.py

            git add -A
            if git diff --cached --quiet; then
              echo "BLOCKED: $asset_id produced no repository changes."
              exit 1
            fi

            git commit -m "Publish $asset_id Mini"
            git push
            export FLH_PUBLISH_COMMIT_SHA="$(git rev-parse HEAD)"
            python scripts/writeback_flh_publication.py
          done < /tmp/flh_queue.txt
