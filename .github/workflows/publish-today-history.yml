name: Publish Today in Florida History

on:
  schedule:
    # 11:15 UTC = 7:15 AM Eastern during daylight saving time.
    - cron: '15 11 * * *'
  workflow_dispatch:
    inputs:
      publish_date:
        description: "Optional YYYY-MM-DD date for controlled manual recovery"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: flh-today-history
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish approved dated entry
        env:
          FLH_TODAY: ${{ inputs.publish_date }}
        run: python scripts/publish_today_history.py
      - name: Refresh sitemap
        run: node scripts/generate-sitemap.mjs
      - name: Commit publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add today-in-florida-history.html index.html sitemap.xml today-history-queue/manifest.json today-*.html
          if git diff --cached --quiet; then
            echo "No Today in Florida History publication due."
            exit 0
          fi
          git commit -m "Publish Today in Florida History"
          git push
