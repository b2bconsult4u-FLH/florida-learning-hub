name: Publish Today in Florida History

on:
  schedule:
    - cron: '17 3 * * *'
      timezone: America/New_York
    - cron: '23 4 * * *'
      timezone: America/New_York
    - cron: '41 5 * * *'
      timezone: America/New_York
    - cron: '17 6 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      publish_date:
        description: Optional YYYY-MM-DD date for controlled manual recovery
        required: false
        type: string
      trigger_source:
        description: Caller label; correlate with actor and run ID for attribution
        required: false
        default: manual
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-today-history.yml'
      - 'scripts/publish_today_history.py'
      - 'scripts/verify_today_history.py'
      - 'scripts/test_today_history.py'
      - 'today-history-queue/manifest.json'
      - 'today-history-queue/*.html'

permissions:
  contents: write

concurrency:
  group: flh-today-history
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLH_TODAY: ${{ inputs.publish_date }}
    steps:
      - name: Record how this run was triggered
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          SOURCE: ${{ inputs.trigger_source }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          {
            echo "### Publication trigger record"
            echo "- run ID: $RUN_ID"
            echo "- caller label: ${SOURCE:-n/a}"
            echo "- event: $EVENT"
            echo "- cron slot (if scheduled): ${SCHEDULE:-n/a}"
            echo "- actor: $ACTOR"
            echo "- run started (UTC): $(date -u +%FT%TZ)"
            echo "- run started (Eastern): $(TZ=America/New_York date +%FT%T%z)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test publication safeguards
        run: python scripts/test_today_history.py
      - name: Publish approved dated entry
        run: python scripts/publish_today_history.py
      - name: Refresh sitemap
        run: node scripts/generate-sitemap.mjs
      - name: Commit publication atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add today-in-florida-history.html index.html sitemap.xml today-history-queue/manifest.json today-*.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish Today in Florida History"
            git push origin HEAD:main
          fi
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Verify live Cloudflare publication
        run: python scripts/verify_today_history.py
