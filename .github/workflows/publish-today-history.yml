name: Publish Today in Florida History

on:
  schedule:
    - cron: '7,27,47 7 * * *'
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      publish_date:
        description: "Optional YYYY-MM-DD date for controlled manual run"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-today-history.yml"

permissions:
  contents: write

concurrency:
  group: flh-today-history
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish approved dated entry
        env:
          FLH_TODAY: ${{ inputs.publish_date }}
        run: python scripts/publish_today_history.py
      - name: Refresh sitemap
        run: node scripts/generate-sitemap.mjs
      - name: Commit publication
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard 'today-*.html')" ]; then
            echo "No Today in Florida History publication due."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add today-in-florida-history.html index.html sitemap.xml today-history-queue/manifest.json today-*.html
          git commit -m "Publish Today in Florida History"
          git push
