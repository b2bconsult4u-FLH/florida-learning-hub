name: FLH Weekly Newsletter
on:
  schedule:
    # UTC triggers covering 9 a.m. Eastern in both DST seasons.
    - cron: '0 13,14 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without creating or sending any Brevo campaign'
        type: boolean
        required: true
        default: true
permissions:
  contents: read
concurrency:
  group: flh-weekly-newsletter
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Select 9 a.m. Eastern schedule
        id: clock
        run: |
          if [ "${{ github.event_name }}" != 'schedule' ] || [ "$(TZ=America/New_York date +%H)" = '09' ]; then
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.clock.outputs.proceed == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.clock.outputs.proceed == 'true'
        with:
          python-version: '3.12'
      - name: Build weekly digest and optionally send
        if: steps.clock.outputs.proceed == 'true'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: '4'
          FLH_NEWSLETTER_SEND: ${{ github.event_name == 'workflow_dispatch' && 'false' || vars.FLH_NEWSLETTER_SEND }}
        run: |
          echo "FLH_WEEK_END=$(TZ=America/New_York date -d 'yesterday' +%F)" >> "$GITHUB_ENV"
          FLH_WEEK_END=$(TZ=America/New_York date -d 'yesterday' +%F) python scripts/send_weekly_newsletter.py
