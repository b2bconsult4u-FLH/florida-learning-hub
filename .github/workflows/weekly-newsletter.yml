name: FLH Weekly Newsletter
on:
  schedule:
    - cron: '0 9 * * 0'
      timezone: America/New_York
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flh-weekly-newsletter
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build weekly digest and optionally send
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: '4'
          FLH_NEWSLETTER_SEND: ${{ vars.FLH_NEWSLETTER_SEND }}
        run: |
          echo "FLH_WEEK_END=$(TZ=America/New_York date -d 'yesterday' +%F)" >> "$GITHUB_ENV"
          FLH_WEEK_END=$(TZ=America/New_York date -d 'yesterday' +%F) python scripts/send_weekly_newsletter.py
